name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Move tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install suiup
        run: |
          curl -sSfL https://raw.githubusercontent.com/MystenLabs/suiup/main/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Sui CLI (testnet channel)
        run: suiup install sui@testnet-v1.76.1

      - name: Verify Sui version
        run: sui --version

      - name: Build and test
        run: sui move test --build-env testnet
